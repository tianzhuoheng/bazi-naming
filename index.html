<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>八字起名 · 完整工具 v15.15 (起名增强版)</title>
<style>
:root{
  --bg:#0a0a1a; --tx:#e8e8f0;
  --p1:#667eea; --p2:#764ba2; --p3:#f093fb;
  --g1:#4facfe; --g2:#00f2fe;
  --gold:#ffd700; --red:#ff6b6b; --green:#51cf66; --orange:#ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3a 50%,#2a1a4a 100%);color:var(--tx);min-height:100vh;padding:20px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto}
.hero{background:linear-gradient(135deg,rgba(102,126,234,.15),rgba(240,147,251,.1));border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(240,147,251,.3),transparent 70%);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-50%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(79,172,254,.3),transparent 70%);border-radius:50%}
.hero-inner{position:relative;z-index:1}
.hero h1{font-size:42px;font-weight:800;background:linear-gradient(90deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hero .sub{color:rgba(255,255,255,.7);font-size:15px;margin-bottom:24px}
.hero .badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.hero .badge{padding:4px 12px;border-radius:20px;font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--g2)}
.input-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;backdrop-filter:blur(10px)}
.input-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
.input-grid .field label{display:block;color:rgba(255,255,255,.6);font-size:12px;margin-bottom:6px}
.input-grid .field input,.input-grid .field select{width:100%;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--tx);font-size:14px}
.btn{padding:12px 24px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s;margin-right:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,.4)}
.btn-outline{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000}
.btn-row{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.result{margin-top:24px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;margin-bottom:16px;position:relative}
.card h2{font-size:20px;margin-bottom:16px;color:var(--p3);display:flex;align-items:center;gap:8px}
.card h2 .icon{font-size:24px}
.bazi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.bazi-cell{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;text-align:center;transition:transform .2s}
.bazi-cell:hover{transform:translateY(-2px);border-color:var(--p3)}
.bazi-cell .label{color:rgba(255,255,255,.5);font-size:11px;margin-bottom:4px}
.bazi-cell .pillar{font-size:36px;font-weight:bold;margin:8px 0;letter-spacing:4px}
.bazi-cell .gan{color:#e0e0e0}
.bazi-cell .zhi{color:var(--gold)}
.bazi-cell .info{font-size:11px;color:rgba(255,255,255,.5)}
.bazi-cell .wx{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-top:4px}
.tag-木{background:rgba(76,175,80,.3);color:#81c784}
.tag-火{background:rgba(244,67,54,.3);color:#e57373}
.tag-土{background:rgba(255,152,0,.3);color:#ffb74d}
.tag-金{background:rgba(158,158,158,.3);color:#e0e0e0}
.tag-水{background:rgba(33,150,243,.3);color:#64b5f6}
.wuxing-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.wx-cell{padding:12px;border-radius:8px;text-align:center;font-size:13px;position:relative;overflow:hidden}
.wx-cell .num{font-size:24px;font-weight:bold;margin:4px 0}
.wx-木{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3)}
.wx-火{background:rgba(244,67,54,.15);border:1px solid rgba(244,67,54,.3)}
.wx-土{background:rgba(255,152,0,.15);border:1px solid rgba(255,152,0,.3)}
.wx-金{background:rgba(158,158,158,.15);border:1px solid rgba(158,158,158,.3)}
.wx-水{background:rgba(33,150,243,.15);border:1px solid rgba(33,150,243,.3)}
.summary{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.3);border-radius:12px;padding:16px;margin:16px 0}
.summary h3{color:var(--gold);margin-bottom:8px;font-size:16px}
.summary .row{display:flex;align-items:center;gap:12px;margin:6px 0;font-size:14px}
.summary .label{color:rgba(255,255,255,.7);min-width:80px}
.summary .value{color:var(--g2);font-weight:600}
.recommend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
.rec-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px;transition:all .2s;cursor:pointer}
.rec-card:hover{transform:translateY(-2px);border-color:var(--p3);background:rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(240,147,251,.2)}
.rec-name{font-size:18px;font-weight:700;color:var(--p3);margin-bottom:4px}
.rec-score{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;font-weight:700;margin-left:8px}
.rec-wx{display:flex;gap:4px;margin:6px 0}
.rec-wx-tag{padding:2px 8px;border-radius:4px;font-size:11px}
.rec-desc{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px}
.rec-strokes{font-size:11px;color:rgba(255,255,255,.5);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.rec-strokes span{padding:2px 6px;background:rgba(255,255,255,.06);border-radius:4px}
.sancai{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;margin-right:6px}
.sancai-大吉{background:rgba(81,207,102,.2);color:#51cf66;border:1px solid rgba(81,207,102,.4)}
.sancai-吉{background:rgba(79,172,254,.2);color:#4facfe;border:1px solid rgba(79,172,254,.4)}
.sancai-半吉{background:rgba(255,159,67,.2);color:#ff9f43;border:1px solid rgba(255,159,67,.4)}
.sancai-半凶{background:rgba(255,107,107,.2);color:#ff6b6b;border:1px solid rgba(255,107,107,.4)}
.sancai-凶{background:rgba(255,107,107,.4);color:#fff;border:1px solid rgba(255,107,107,.6)}
.alert{padding:12px 16px;border-radius:10px;margin:12px 0;font-size:13px}
.alert-info{background:rgba(79,172,254,.15);border:1px solid rgba(79,172,254,.3);color:var(--g1)}
.alert-warn{background:rgba(255,159,67,.15);border:1px solid rgba(255,159,67,.3);color:var(--orange)}
.tab-row{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.tab{padding:10px 20px;cursor:pointer;border-radius:10px 10px 0 0;font-size:14px;color:rgba(255,255,255,.6);background:transparent;border:none;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--p3);border-bottom-color:var(--p3);background:rgba(240,147,251,.08)}
.tab:hover:not(.active){color:var(--tx);background:rgba(255,255,255,.05)}
.tab-content{display:none}
.tab-content.active{display:block}
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.case-btn{padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;color:var(--tx)}
.case-btn:hover{background:rgba(102,126,234,.2);border-color:var(--p1)}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);margin:24px 0}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.kpi{background:rgba(255,255,255,.05);padding:12px;border-radius:10px;text-align:center}
.kpi .num{font-size:24px;font-weight:700;color:var(--gold)}
.kpi .lbl{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px}
@media(max-width:768px){
  .input-grid{grid-template-columns:repeat(2,1fr)}
  .bazi-grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:28px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<div class="wrap">
  <div class="hero">
    <div class="hero-inner">
      <h1>🔮 八字起名 · 完整工具 v15.15 (起名增强)</h1>

      <button class="btn btn-outline" onclick="clearAll()">清空</button>
    </div>

      <button class="case-btn" onclick="loadCase(1985,5,20,12,0,120,'男')">1985-5-20 男</button>
      <button class="case-btn" onclick="loadCase(1990,6,15,18,0,120,'女')">1990-6-15 女</button>

    </div>
  </div>

  <div id="resultArea"></div>
</div>

function lunarYearDays(y) {
  var i, sum = 348;
  for (i = 0x8000; i > 0x8; i >>= 1) {
    sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
  }
  return sum + leapDays(y);
}

function leapMonth(y) {
  return LUNAR_INFO[y-1900] & 0xf;
}

function leapDays(y) {
  if (leapMonth(y)) {
    return (LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}

function monthDays(y, m) {
  return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29;
}

// 阴历转阳历
function lunarToSolar(ly, lm, ld, isLeap) {
  if (ly < 1900 || ly > 2100) return null;
  if (lm < 1 || lm > 12) return null;
  if (ld < 1 || ld > 30) return null;
  // 1900年春节 (阳历1900-01-31) JDN = 2415051.5
  var BASE_JDN = 2415051.5;
  var offset = 0;
  for (var yy = 1900; yy < ly; yy++) {
    offset += lunarYearDays(yy);
  }
  var leap = leapMonth(ly);
  for (var mm = 1; mm < lm; mm++) {
    offset += monthDays(ly, mm);
    if (mm === leap) offset += leapDays(ly);
  }
  if (isLeap && lm === leap) {
    offset += monthDays(ly, lm);
  }
  offset += ld - 1;
  var solarJdn = BASE_JDN + offset;
  return jdnToSolar(solarJdn);
}

function jdnToSolar(jdn) {
  var z = Math.floor(jdn - 0.5) + 0.5;
  var a = z;
  var alpha = Math.floor((z - 1867216.25) / 36524.25);
  a = z + 1 + alpha - Math.floor(alpha / 4);
  var b = a + 1524;
  var c = Math.floor((b - 122.1) / 365.25);
  var d = Math.floor(365.25 * c);
  var e = Math.floor((b - d) / 30.6001);
  var day = b - d - Math.floor(30.6001 * e);
  var month = (e < 14) ? e - 1 : e - 13;
  var year = (month > 2) ? c - 4716 : c - 4715;
  return { y: year, m: month, d: day };
}

// ========== 八字排盘 ==========
// Reference: 1984-02-02 = 甲子日 (Chinese tradition)
var REF_DAY_JDN = 2415021.5;  // 1900-01-01 noon (中国传统万年历, 用户验证)
var REF_DAY_POS = 10;          // 甲戌 = position 10 (中国传统万年历, 用户验证)

// 经度时差修正 (单位：分钟)，中国以东八区(UTC+8)中央经线 120°E 为基准
// 每 1° 经度 = 4 分钟
function longitudeOffset(lonDeg) {
  return (120 - lonDeg) * 4;  // minutes
}

// 时辰 → 地支 (按真太阳时)
function hourToZhi(hour, minute) {
  // 真太阳时
  var totalMinutes = hour * 60 + minute;
  // 子时: 23:00 - 00:59 (or 0:00-1:00)
  if (totalMinutes >= 23*60 || totalMinutes < 60) return '子';
  if (totalMinutes < 3*60) return '丑';
  if (totalMinutes < 5*60) return '寅';
  if (totalMinutes < 7*60) return '卯';
  if (totalMinutes < 9*60) return '辰';
  if (totalMinutes < 11*60) return '巳';
  if (totalMinutes < 13*60) return '午';
  if (totalMinutes < 15*60) return '未';
  if (totalMinutes < 17*60) return '申';
  if (totalMinutes < 19*60) return '酉';
  if (totalMinutes < 21*60) return '戌';
  return '亥';
}

// 五日一元法: 时辰对应的天干
// 甲己日起甲子时，乙庚日起丙子时，丙辛日起戊子时，丁壬日起庚子时，戊癸日起壬子时
function dayGanToHourGanStart(dayGan) {
  var map = {'甲':'甲','己':'甲','乙':'丙','庚':'丙','丙':'戊','辛':'戊','丁':'庚','壬':'庚','戊':'壬','癸':'壬'};
  return map[dayGan];
}

// JDN 计算 (与之前相同)
function dateToJDN(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  var A = Math.floor(y/100);
  var B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524;
}

// 从 JDN 获取日柱 (基于 1984-02-02 = 甲子日 参考)
function getDayGanZhi(jdn) {
  // 注意：JDN 是 UTC 正午起算，但中国日历日是本地子时起算
  // 对于中国日期，要看本地日期对应的 JDN
  // 简化：用 jdn + 0.5 的本地日界（中国在东八区，子时 = 当地 23:00-01:00）
  // 实际上：中国日期 = JDN + 0.5 / 1
  // 暂时直接用 JDN 的整数部分
  var dayDiff = Math.round(jdn) - Math.round(REF_DAY_JDN);
  var pos = ((dayDiff % 60) + 60 + REF_DAY_POS) % 60;
  var gan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][pos % 10];
  var zhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][pos % 12];
  return {gan: gan, zhi: zhi, pos: pos};
}

// 查找 节气: 找到某年某月附近的节气
function getSolarTermsNear(year, jdn) {
  var ts = SOLAR_TERMS[year];
  if (!ts) return [];
  // 找出此 JDN 前后 60 天的节气
  return ts.filter(function(t) { return Math.abs(t.j - jdn) < 60; });
}

// 月支 → 节气起始（节，不是中气）
// 子月(11月)：大雪开始；丑月(12月)：小寒开始；寅月(1月)：立春开始...
// 24 节气中有 12 个 "节"，分别对应 12 月支
var MONTH_ZHI_START_TERM = [
  {zhi: '寅', term: '立春', monthNum: 1},
  {zhi: '卯', term: '惊蛰', monthNum: 2},
  {zhi: '辰', term: '清明', monthNum: 3},
  {zhi: '巳', term: '立夏', monthNum: 4},
  {zhi: '午', term: '芒种', monthNum: 5},
  {zhi: '未', term: '小暑', monthNum: 6},
  {zhi: '申', term: '立秋', monthNum: 7},
  {zhi: '酉', term: '白露', monthNum: 8},
  {zhi: '戌', term: '寒露', monthNum: 9},
  {zhi: '亥', term: '立冬', monthNum: 10},
  {zhi: '子', term: '大雪', monthNum: 11},
  {zhi: '丑', term: '小寒', monthNum: 12}
];

// 计算月柱：根据本地时间找到对应的月支
function getMonthPillar(localJdn, year) {
  // 找出此 localJdn 之前最近的一个"节"
  var monthZhi = null;
  var monthNum = null;
  var lastTerm = null;
  
  // 先看本年的节气
  var ts = SOLAR_TERMS[year] || [];
  for (var i = 0; i < ts.length; i++) {
    if (ts[i].j <= localJdn) {
      var termInfo = MONTH_ZHI_START_TERM.find(function(m){ return m.term === ts[i].n; });
      if (termInfo) {
        monthZhi = termInfo.zhi;
        monthNum = termInfo.monthNum;
        lastTerm = ts[i];
      }
    }
  }
  
  // 如果没找到（说明日期在年初第一个节之前），看前一年
  if (!monthZhi) {
    var prevTs = SOLAR_TERMS[year - 1] || [];
    for (var i = prevTs.length - 1; i >= 0; i--) {
      if (prevTs[i].j <= localJdn) {
        var termInfo = MONTH_ZHI_START_TERM.find(function(m){ return m.term === prevTs[i].n; });
        if (termInfo) {
          monthZhi = termInfo.zhi;
          monthNum = termInfo.monthNum;
          lastTerm = prevTs[i];
          break;
        }
      }
    }
  }
  
  // 计算年干（看 立春）
  // 立春可能在 year 的 2 月或 year-1 的 2 月
  // year pillar changes at 立春 of year
  var lichunYear = year;
  if (SOLAR_TERMS[year]) {
    var lichun = SOLAR_TERMS[year].find(function(t){ return t.n === '立春'; });
    if (lichun && localJdn < lichun.j) {
      // still in previous year's 八字年
      lichunYear = year - 1;
    }
  }
  var ygIdx = (lichunYear - 4) % 10;
  if (ygIdx < 0) ygIdx += 10;
  var yzIdx = (lichunYear - 4) % 12;
  if (yzIdx < 0) yzIdx += 12;
  var yg = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][ygIdx];
  var yz = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][yzIdx];
  
  // 月干：甲己之年丙作首
  var monthGanStart = {'甲':'丙','己':'丙','乙':'戊','庚':'戊','丙':'庚','辛':'庚','丁':'壬','壬':'壬','戊':'甲','癸':'甲'};
  var startGan = monthGanStart[yg];
  var startIdx = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'].indexOf(startGan);
  var zhiIdx = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'].indexOf(monthZhi);
  // 月支序号: 寅=0, 卯=1, ..., 子=10, 丑=11
  var orderIdx = (zhiIdx - 2 + 12) % 12;
  var mgIdx = (startIdx + orderIdx) % 10;
  var mg = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][mgIdx];
  
  return {
    yearGan: yg, yearZhi: yz,
    monthGan: mg, monthZhi: monthZhi,
    monthNum: monthNum
  };
}

// 主函数：完整八字排盘
// 输入：本地时间（公历年/月/日/时/分）+ 经度
// 输出：年柱 月柱 日柱 时柱
function getBaziV2(year, month, day, hour, minute, lonDeg) {
  // 1. 真太阳时校正
  var offsetMin = longitudeOffset(lonDeg || 120);  // 默认 120°E（北京）
  var totalMin = hour * 60 + minute + offsetMin;
  
  // 处理跨日
  var localY = year, localM = month, localD = day;
  if (totalMin < 0) {
    totalMin += 24 * 60;
    // 前一天
    var d = new Date(year, month - 1, day);
    d.setDate(d.getDate() - 1);
    localY = d.getFullYear(); localM = d.getMonth() + 1; localD = d.getDate();
  } else if (totalMin >= 24 * 60) {
    totalMin -= 24 * 60;
    var d = new Date(year, month - 1, day);
    d.setDate(d.getDate() + 1);
    localY = d.getFullYear(); localM = d.getMonth() + 1; localD = d.getDate();
  }
  
  var localHour = Math.floor(totalMin / 60);
  var localMin = totalMin - localHour * 60;
  
  // 2. 月柱用真实本地时间（节气判断）
  var localJdn = dateToJDN(localY, localM, localD) + (totalMin - 1200) / 1440;
  // 2b. 日柱用 +0.5 偏移（中国日期从子时开始，需要 +0.5 对齐日界）
  var dayJdn = dateToJDN(localY, localM, localD) + 0.5;
  
  // 3. 日柱
  var dayP = getDayGanZhi(dayJdn);
  
  // 4. 时辰地支
  var hourZhi = hourToZhi(localHour, localMin);
  
  // 5. 时辰天干 (基于日干)
  var hourGanStart = dayGanToHourGanStart(dayP.gan);
  var startIdx = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'].indexOf(hourGanStart);
  var zhiIdx = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'].indexOf(hourZhi);
  var hgIdx = (startIdx + zhiIdx) % 10;
  var hourGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][hgIdx];
  
  // 6. 年月柱（基于本地时间）
  var monthResult = getMonthPillar(localJdn, localY);
  
  // 出生本地时间的 JDN (用于大运起运计算)
  var birthJdn = dateToJDN(localY, localM, localD) + localHour / 24 + localMin / 1440;
  return {
    yearGan: monthResult.yearGan,
    yearZhi: monthResult.yearZhi,
    monthGan: monthResult.monthGan,
    monthZhi: monthResult.monthZhi,
    dayGan: dayP.gan,
    dayZhi: dayP.zhi,
    hourGan: hourGan,
    hourZhi: hourZhi,
    year: monthResult.yearGan + monthResult.yearZhi,
    month: monthResult.monthGan + monthResult.monthZhi,
    day: dayP.gan + dayP.zhi,
    hour: hourGan + hourZhi,
    localY: localY, localM: localM, localD: localD,
    localHour: localHour, localMin: localMin,
    offsetMin: offsetMin,
    birthJdn: birthJdn

function applyTiaoHou(monthZhi, xi, ji, dayMasterWx, strength) {
  var th = getTiaoHou(monthZhi);
  if (!th) return;
  
  // 调候与旺衰融合:
  // 1. 调候用神: 加入喜 (若已在忌中, 移到喜)
  // v15.13: step1 只在 primary 已在 xi 时调整顺序, 不从 ji 移到 xi
  // 理由: 调候元素如果身忌(如身弱忌官杀), 不应"抢救"到喜
  if (th.primary) {
    if (xi.indexOf(th.primary) >= 0) {
      xi.splice(xi.indexOf(th.primary), 1);
      xi.unshift(th.primary);
    }
    // primary 在 ji 中则不动 (留在忌中)
  }
  // 2. 生调候的元素: 加入喜 (若已在忌中, 移到喜)
  // v15.13: step2 只在 secondary 已在 xi 时调整顺序, 不从 ji 移到 xi
  if (th.secondary) {
    if (xi.indexOf(th.secondary) >= 0) {
      xi.splice(xi.indexOf(th.secondary), 1);
      xi.push(th.secondary);
    }
    // secondary 在 ji 中则不动
  }
  // 3. 克调候的元素: 加入忌 (无条件, 即使与日主同类)
  // v15.6: 调候禁仅当与日主同类(比劫)或印时才加入忌
  // 食伤(我生)/财(我克)/官杀(克我)即使是调候禁也保留为喜
  var _wxShengTo6 = { '木':'水','火':'木','土':'火','金':'土','水':'金' };
  var _forbidIsBiJie = (th.forbid === dayMasterWx);
  var _forbidIsYin = (th.forbid === _wxShengTo6[dayMasterWx]);
  if (th.forbid && (_forbidIsBiJie || _forbidIsYin) && ji.indexOf(th.forbid) < 0) {
    ji.unshift(th.forbid);
  }
  // 3b. 同元素移除: 仅当禁元素同时在忌中, 才从喜中移除 (避免喜忌矛盾)
  // 食伤/财即使与调候禁相同, 只要不在忌中, 保留为喜
  if (th.forbid && xi.indexOf(th.forbid) >= 0 && ji.indexOf(th.forbid) >= 0) {
    xi.splice(xi.indexOf(th.forbid), 1);
  }
  if (th.weaken && xi.indexOf(th.weaken) >= 0 && ji.indexOf(th.weaken) >= 0) {
    xi.splice(xi.indexOf(th.weaken), 1);
  }
  // 4. 调候所克的同类: 加入忌 (若已在喜中, 移到忌)
  // v15.13: 身旺才把 weaken 加忌 (身弱时 weaken 类元素是喜)
  if (th.weaken && strength > 0.55) {
    if (xi.indexOf(th.weaken) >= 0) xi.splice(xi.indexOf(th.weaken), 1);
    if (ji.indexOf(th.weaken) < 0) ji.push(th.weaken);
  }
  // 5. 调候克日主同类: 加入忌 (但保留原旺衰计算)
  // 例外: 调候 forbid === dayMasterWx (同类被禁) 时不强制加
  // v15.13: 身旺才把比劫从 xi 移到 ji (身弱时比劫是喜, 不能移到忌)
  if (dayMasterWx && dayMasterWx !== th.primary && strength > 0.55) {
    if (xi.indexOf(dayMasterWx) >= 0) xi.splice(xi.indexOf(dayMasterWx), 1);
    if (ji.indexOf(dayMasterWx) < 0) ji.push(dayMasterWx);
  }
}

function strokeToWuXing(s) {
  if (!s) return '水';
  // v15.15 fix: 取末位数字决定五行
  var n = parseInt(s, 10);
  if (isNaN(n) || n <= 0) return '水';
  var lastDigit = n % 10;
  if (lastDigit === 1 || lastDigit === 2) return '木';
  if (lastDigit === 3 || lastDigit === 4) return '火';
  if (lastDigit === 5 || lastDigit === 6) return '土';
  if (lastDigit === 7 || lastDigit === 8) return '金';
  if (lastDigit === 9 || lastDigit === 0) return '水';
  return '水';
}

function calcFiveGrids(surname, givenName) {

  var gnStrokes = gnChars.map(function(c) { return KX_STROKES[c] || 0; });
  var tianGe = sxChars.length === 1 ? sxStrokes[0] + 1 : sxStrokes[0] + sxStrokes[1];

// 阴历转阳历包装函数
function convertToSolar(inputs) {
  if (inputs.calendar === 'solar') {
    return { year: inputs.year, month: inputs.month, day: inputs.day };
  }
  // 阴历转换
  var r = lunarToSolar(inputs.year, inputs.month, inputs.day, inputs.isLeapMonth);
  if (!r) {
    throw new Error('阴历日期无效或超出范围 (1900-2100)');
  }
  // lunarToSolar 返回 {y, m, d}, d 可能是 .5
  var d = Math.floor(r.d);
  if (d < 1) d = 1;
  return { year: r.y, month: r.m, day: d };
}

function calcDayun(bz, gender, year) {
  var dir = (gender === '男' && (bz.yearGan === '甲' || bz.yearGan === '丙' || bz.yearGan === '戊' || bz.yearGan === '庚' || bz.yearGan === '壬')) ||
            (gender === '女' && (bz.yearGan === '乙' || bz.yearGan === '丁' || bz.yearGan === '己' || bz.yearGan === '辛' || bz.yearGan === '癸'));
  // 起运年龄: 3天折1年 (4小时折1天)
  var birthJdn = (typeof bz.birthJdn === 'number') ? bz.birthJdn : 0;  // 出生本地时间的 JDN
  var terms = SOLAR_TERMS[year] || [];
  var diffDays = 0;
  // 男阳/女阴: 顺行 -> 到下一个节气
  // 男阴/女阳: 逆行 -> 到上一个节气
  var useForward = dir;
  // v15.9: 起运计算取最近一个月令切换的节(不论前后), 跨3年检查
  var ZHONGQI_NAMES = { '雨水':1, '春分':1, '谷雨':1, '小满':1, '夏至':1, '大暑':1, '处暑':1, '秋分':1, '霜降':1, '小雪':1, '冬至':1, '大寒':1 };
  // 跨年收集节气, 避免出生在年初/年末时找不到最近节
  var _allTerms = [];
  for (var _yy = year - 1; _yy <= year + 1; _yy++) {
    if (SOLAR_TERMS[_yy]) {
      for (var _kk = 0; _kk < SOLAR_TERMS[_yy].length; _kk++) {
        _allTerms.push(SOLAR_TERMS[_yy][_kk]);
      }
    }
  }
  // 找最近一个"月令切换"的节(节=非中气)
  var _nearestTerm = null, _nearestDiff = Infinity;
  for (var _kk2 = 0; _kk2 < _allTerms.length; _kk2++) {
    if (ZHONGQI_NAMES[_allTerms[_kk2].n]) continue;
    var _dAbs = Math.abs(_allTerms[_kk2].j - birthJdn);
    if (_dAbs < _nearestDiff) { _nearestDiff = _dAbs; _nearestTerm = _allTerms[_kk2]; }
  }
  diffDays = _nearestTerm ? _nearestDiff : 0;
  // 注: 大运排列方向仍按阴/阳年男/女规则
  var startYears = diffDays / 3;  // 3天折1年
  var startAge = Math.ceil(startYears);  // 进一法取整
  if (startAge < 1) startAge = 1;
  
  var dayuns = [];
  var gans = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var zhis = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var monthGanIdx = gans.indexOf(bz.monthGan);
  var monthZhiIdx = zhis.indexOf(bz.monthZhi);
  // 第一步大运起运年龄 = startAge
  for (var i = 1; i <= 8; i++) {
    var age = startAge + (i - 1) * 10;
    var ganIdx, zhiIdx;
    if (dir) {
      ganIdx = (monthGanIdx + i) % 10;
      zhiIdx = (monthZhiIdx + i) % 12;
    } else {
      ganIdx = (monthGanIdx - i + 10) % 10;
      zhiIdx = (monthZhiIdx - i + 12) % 12;
    }
    dayuns.push({ age: age, gan: gans[ganIdx], zhi: zhis[zhiIdx], startYear: year + age });
  }
  // 也保存起运年龄便于显示
  dayuns.unshift({ isStart: true, age: startAge, startYear: year + startAge });
  return dayuns;
}

function renderDayuns(dayuns) {
  var html = '<div style="margin-top:16px"><h4 style="color:var(--g2);margin-bottom:10px">大运 (每 10 年一运)</h4>';
  html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
  dayuns.forEach(function(d) {
    html += '<div style="background:rgba(255,255,255,.04);padding:10px;border-radius:8px;text-align:center">';
    html += '<div style="font-size:11px;color:rgba(255,255,255,.5)">' + d.age + '岁 · ' + d.startYear + '</div>';
    html += '<div style="font-size:24px;font-weight:700;color:var(--gold);margin:4px 0">' + d.gan + d.zhi + '</div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

  var fts = [analysis.gridFortune.tian, analysis.gridFortune.ren, analysis.gridFortune.di, analysis.gridFortune.wai, analysis.gridFortune.zong];
  for (var i = 0; i < 5; i++) {

    html += '<span style="font-size:18px;color:var(--gold);font-weight:700">' + nw.char + '</span>';
    html += ' <span class="wx tag-' + nw.wuxing + '">' + nw.wuxing + '</span>';
    html += ' <span style="font-size:11px;color:rgba(255,255,255,.5)">' + nw.strokes + '画</span>';

  html += '</div></div>';

// ========== v15.15 起名增强 - generateNames 升级版 ==========
function generateNames_v15_15() {
  if (!currentResult) { alert('请先点击"完整分析"获取八字和喜忌'); return; }
  var surname = currentResult.inputs.surname;
  var xi = currentResult.xy.xi;
  var candidates = [];
  xi.forEach(function(wx) {
    if (NAME_POOL[wx]) {
      NAME_POOL[wx].forEach(function(ch) {
        candidates.push({ wx: wx, c: ch.c, s: ch.s, m: ch.m, tag: ch.tag, struct: ch.struct });
      });
    }
  });
  if (candidates.length < 2) { alert('候选字不足，请检查字库'); return; }
  // v15.18: 按 c1 分组, 每个首字保留 top 3 组合 -> 多样性
  var results = [];
  var seen = new Set();
  for (var i = 0; i < candidates.length; i++) {
    var c1 = candidates[i];
    var maxForThis = 0;
    for (var j = 0; j < candidates.length && maxForThis < 3; j++) {
      if (i === j) continue;
      var c2 = candidates[j];
      var givenName = c1.c + c2.c;
      var fullName = surname + givenName;
      if (seen.has(fullName)) continue;
      seen.add(fullName);
      var analysis = analyzeName_v15_15(surname, givenName, currentResult.xy);
      results.push({ name: fullName, givenName: givenName, score: analysis.score, analysis: analysis, char1: c1, char2: c2 });
      maxForThis++;
    }
  }
  results.sort(function(a, b) { return b.score - a.score; });

  // v15.18 多样性: 按 c1.wx 配额, 每个 wx 至少 15 个不同首字
  var byWxChar = {};
  results.forEach(function(r) {
    var k = r.char1.wx + '|' + r.char1.c;
    if (!byWxChar[k]) byWxChar[k] = [];
    byWxChar[k].push(r);
  });
  // 每个 wx 单独取前 15 个不同首字
  var groups = {};
  ['\u6c34','\u6728','\u706b','\u571f','\u91d1'].forEach(function(wx) {
    var keys = Object.keys(byWxChar).filter(function(k) { return k.indexOf(wx + '|') === 0; });
    keys.slice(0, 15).forEach(function(k) {
      groups[k] = byWxChar[k][0];
    });
  });
  // 按 score 排序
  var pool = Object.values(groups);
  pool.sort(function(a, b) {
    var sd = b.score - a.score;
    if (sd !== 0) return sd;
    var pd = (b.analysis.phoneticScore||0) - (a.analysis.phoneticScore||0);
    return pd;
  });
  // round-robin 混合: 水木交错, 每个 wx 15 个
  var water = pool.filter(function(r) { return r.char1.wx === '\u6c34'; });
  var wood = pool.filter(function(r) { return r.char1.wx === '\u6728'; });
  var fire = pool.filter(function(r) { return r.char1.wx === '\u706b'; });
  var top = [];
  var maxLen = Math.max(water.length, wood.length, fire.length, 15);
  for (var i = 0; i < maxLen && top.length < 30; i++) {
    if (water[i]) top.push(water[i]);
    if (wood[i]) top.push(wood[i]);
    if (fire[i]) top.push(fire[i]);
  }
  var html = '';
  html += '<div class="card">';
  html += '<h2><span class="icon">✨</span>起名推荐 v15.15 (基于喜用神: ' + xi.join(' ') + ')</h2>';
  html += '<div class="alert alert-info">综合评分排序 (三才+五格+五行+寓意+音韵+字形)。点击名字查看详细分析。</div>';
  html += '<div class="recommend-grid">';
  top.forEach(function(r, idx) {
    var sancaiCls = r.analysis.sancai === '大吉' ? 'sancai-大吉' : (r.analysis.sancai === '吉' ? 'sancai-吉' : (r.analysis.sancai === '凶' ? 'sancai-凶' : 'sancai-半吉'));
    html += '<div class="rec-card" onclick="showNameDetail(' + idx + ')">';
    html += '<div class="rec-name">' + r.name + '<span class="rec-score">' + r.score + '分</span></div>';
    html += '<div class="rec-wx">';
    html += '<span class="rec-wx-tag wx tag-' + r.char1.wx + '">' + r.char1.c + '·' + r.char1.wx + '</span>';
    html += '<span class="rec-wx-tag wx tag-' + r.char2.wx + '">' + r.char2.c + '·' + r.char2.wx + '</span>';
    html += '</div>';
    html += '<span class="sancai ' + sancaiCls + '">三才: ' + r.analysis.sancaiKey + ' ' + r.analysis.sancai + '</span>';
    html += '<div class="rec-desc">' + r.char1.m + '；' + r.char2.m + '</div>';
    html += '<div class="rec-strokes">';
    html += '<span>天格 ' + r.analysis.grids.tianGe + '</span>';
    html += '<span>人格 ' + r.analysis.grids.renGe + '</span>';
    html += '<span>地格 ' + r.analysis.grids.diGe + '</span>';
    html += '<span>外格 ' + r.analysis.grids.waiGe + '</span>';
    html += '<span>总格 ' + r.analysis.grids.zongGe + '</span>';
    html += '</div>';
    var ps = (r.analysis && r.analysis.phoneticScore) || 0;
    if (r.analysis.semanticBonus || r.analysis.toneScore || r.analysis.structScore || ps) {
      html += '<div class="rec-bonus" style="margin-top:6px;font-size:11px;color:rgba(255,215,0,.7)">';
      if (r.analysis.semanticBonus > 0) html += '寓意+' + r.analysis.semanticBonus + ' ';
      if (r.analysis.toneScore !== 0) html += '声调' + (r.analysis.toneScore > 0 ? '+' : '') + r.analysis.toneScore + ' ';
      if (r.analysis.structScore > 0) html += '字形+' + r.analysis.structScore;
      var psIcon = ps >= 4 ? String.fromCharCode(0x1F380) : (ps <= -6 ? String.fromCharCode(0x26A0) + String.fromCharCode(0xFE0F) : String.fromCharCode(0x1F3B5));
      var psLabel = ps >= 4 ? '好听' : (ps <= -6 ? '拗口' : '一般');
      html += ' <span title="' + psLabel + '">' + psIcon + '音韵' + (ps > 0 ? '+' : '') + ps + '</span>';
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="kpi-row" style="margin-top:16px">';
  html += '<div class="kpi"><div class="num">' + top.length + '</div><div class="lbl">推荐名数</div></div>';
  html += '<div class="kpi"><div class="num">' + Math.round(top.reduce(function(a,b){return a+b.score;},0)/top.length) + '</div><div class="lbl">平均分</div></div>';
  html += '<div class="kpi"><div class="num">' + top[0].score + '</div><div class="lbl">最高分</div></div>';
  var totalPool = NAME_POOL['木'].length + NAME_POOL['火'].length + NAME_POOL['土'].length + NAME_POOL['金'].length + NAME_POOL['水'].length;
  html += '<div class="kpi"><div class="num">' + totalPool + '</div><div class="lbl">v15.15 候选字库</div></div>';
  html += '</div>';
  html += '</div>';
  window._topNames = top;
  document.getElementById('resultArea').innerHTML = html;
}

function showNameDetail(idx) {
  var r = window._topNames[idx];
  if (!r) return;
  var html = '<div class="card">';
  html += '<h2><span class="icon">📋</span>详细分析: ' + r.name + '</h2>';
  html += renderNameAnalysis(r.analysis);
  html += '<div style="margin-top:16px;text-align:center"><button class="btn" onclick="runFullAnalysis()">返回八字</button></div>';
  html += '</div>';
  document.getElementById('resultArea').innerHTML = html;
  window.scrollTo({top: 0, behavior: 'smooth'});
}
